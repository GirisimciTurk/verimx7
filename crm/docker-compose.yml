# Verimx7 — Twenty CRM, yalnızca yerel geliştirme makinesinde.
# Resmî twenty-docker yığınından uyarlandı: server + worker + Postgres + Redis.
# Sunucuya gitmez (CI rsync'i crm/'ı hariç tutar).
#
# Sırlar bu dizindeki .env'de (gitignore'da). Yalnızca 127.0.0.1:3020 açılır.
#
# Başlat:   cd crm && docker compose up -d     → http://localhost:3020
# Durdur:   docker compose stop   (veriler kalır; `down -v` verileri siler)
# Sürüm:    .env içindeki TAG'i değiştir, sonra up -d.

name: verimx7-crm

x-twenty-env: &twenty-env
  PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD}@db:5432/${PG_DATABASE_NAME:-default}
  SERVER_URL: ${SERVER_URL:-http://localhost:3020}
  REDIS_URL: redis://redis:6379
  STORAGE_TYPE: local
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}

services:
  server:
    image: twentycrm/twenty:${TAG:-v2.46.0}
    container_name: twenty-server
    restart: unless-stopped
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    environment:
      <<: *twenty-env
      NODE_PORT: 3000
    ports:
      - "127.0.0.1:3020:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  worker:
    image: twentycrm/twenty:${TAG:-v2.46.0}
    container_name: twenty-worker
    restart: unless-stopped
    command: ["yarn", "worker:prod"]
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    environment:
      <<: *twenty-env
      # Migration ve cron kaydı server'da çalışır.
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: twenty-db
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER:-postgres} -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: twenty-redis
    restart: unless-stopped
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  server-local-data:
